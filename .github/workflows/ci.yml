name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guards (wording, secrets, payments, legal drafts)
        run: npm run guard
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Unit + database/RLS tests (PGlite)
        run: npm test
      - name: Build web
        run: npm run build:web
      - name: Build admin
        run: npm run build:admin
      - name: Bundle Android JS (no native build)
        run: npx expo export --platform android --output-dir /tmp/expo-export
        working-directory: apps/mobile
